# Tiers 1 to 3 of the approach scorecard on every push; red until every gap is closed.
name: approach

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  approach:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the secret scan reads the whole history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Approach scorecard, Tiers 1 to 3
        run: make approach PY=python
      - name: Keep the scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approach-report
          path: approach/report.*
