# The tests in sample mode on every push: no Zetaris, Nightshift, H-MEM or secrets.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests in sample mode
        env:
          SAMPLE_MODE: "true"
          LOG_STDOUT: "false"
        run: python -m pytest -q tests
