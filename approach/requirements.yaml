# Every requirement from the HackOS documents, once, with the check that proves it.
# Run: make approach  (writes approach/report.md and approach/report.json, fails on any Tier 1 to 3 gap)
#
# Sources (saved copies outside the repo: ~/Documents/hackathon/retrofit/approach/hackos-docs/):
#   AG  How APPROACH Solutioning For Your Use Case (sections 1 to 22)
#   SR  Submission Requirements          DQ  Disqualification Checklist
#   FP  Submission Form Preview          SS  Strong Submission Examples
#   HO  our own decisions in the 25 Oct handoff (D1 to D8)
# Where the documents and the Official Rules differ, the Official Rules apply (Cursor is optional).
#
# criterion: impact 30, technical 20, innovation 15, demo 15, product_ux 10, sponsor 10, gate (pass or fail, no points)
# tier: 1 repository (seconds, CI), 2 agent behaviour (sample mode, CI), 3 outcomes (CI), 4 live (this Mac, --live), manual
# check:
#   test: [pytest node ids]       all must pass; a pending (xfail) test counts as a gap
#   fn: name (+ args)             a function in scripts/approach_check.py
#   readme: [regex, ...]          every pattern must match README.md (case insensitive, multiline)
#   manual                        a person confirms it: set done and evidence
#   na                            does not apply to this project (reason in evidence)
# legacy: the id in the 25 Oct proposal page (approach-check.html), where there was one.

criteria:
  impact: {points: 30, name: Impact}
  technical: {points: 20, name: Technical}
  innovation: {points: 15, name: Innovation}
  demo: {points: 15, name: Demo}
  product_ux: {points: 10, name: Product and UX}
  sponsor: {points: 10, name: Sponsor technology}
  gate: {points: 0, name: Gate (pass or fail)}

requirements:

